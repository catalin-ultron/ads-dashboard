[project]
name = "nsa-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mpxj==16.10.0",
    "JPype1>=1.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
